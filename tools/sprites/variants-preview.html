<!doctype html>
<!--
  Essais de variantes de sprites (0.4). Ouvrir avec le serveur de dev :
  http://localhost:5173/tools/sprites/variants-preview.html
  Le tank démon est généré par tools/sprites/tank-demon.mjs (relancer le script après une retouche).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Variantes de sprites</title>
    <style>
      @font-face {
        font-family: 'DungeonMode';
        src: url('/assets/fonts/dungeon-mode.ttf');
      }
      @font-face {
        font-family: 'Monogram';
        src: url('/assets/fonts/monogram-extended.ttf');
      }
      * {
        margin: 0;
        box-sizing: border-box;
        font-synthesis: none;
      }
      body {
        background: #14121a;
        color: #ece6d6;
        padding: 24px;
        font-family: 'DungeonMode', monospace;
        -webkit-font-smoothing: none;
      }
      h1 {
        font-size: 24px;
        color: #e8c25a;
        margin-bottom: 8px;
      }
      h2 {
        font-size: 16px;
        color: #e8c25a;
        margin: 24px 0 12px;
      }
      p {
        font-family: 'Monogram', monospace;
        font-size: 24px;
        color: #a89f8c;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        border: 2px solid #3a3446;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        margin: 12px 0;
      }
      button {
        font: inherit;
        font-size: 12px;
        background: #1d1a24;
        color: #ece6d6;
        border: 2px solid #3a3446;
        padding: 6px 10px;
        cursor: pointer;
      }
      button.on {
        border-color: #e8c25a;
        color: #e8c25a;
      }
    </style>
  </head>
  <body>
    <h1>Variantes de sprites</h1>
    <p>Tank : l'orc du pack (à gauche) repeint en démon, cornes en croissant et yeux blancs.</p>
    <div class="toolbar">
      <button id="idle" class="on">Repos</button>
      <button id="run">Course</button>
    </div>

    <h2>De près (×8)</h2>
    <canvas id="zoom"></canvas>

    <h2>Taille du jeu (×2), avec le reste du bestiaire</h2>
    <canvas id="game"></canvas>

    <script type="module">
      const ATLAS = '/assets/sprites/0x72/0x72_DungeonTilesetII_v1.7.png';
      const TANK = '/assets/sprites/monsters/monsters.png';
      const FLOOR = [16, 64, 16, 16]; // floor_1
      const FLOOR_DARKEN = 0.4; // FLOOR.darken (data/sprites.ts)
      const FRAME_TIME = 0.1;

      const load = (src) =>
        new Promise((ok, ko) => {
          const img = new Image();
          img.onload = () => ok(img);
          img.onerror = ko;
          img.src = src;
        });
      const [atlas, tank] = await Promise.all([load(ATLAS), load(`${TANK}?t=${Date.now()}`)]);

      /** Images d'un sprite : [image, x, y, w, h] ; idle = 4 premières, run = 4 suivantes. */
      const strip = (img, x0, y, w, h, step = w) =>
        Array.from({ length: 8 }, (_, i) => [img, x0 + i * step, y, w, h]);
      const SPRITES = {
        ogre: strip(atlas, 16, 380, 32, 36),
        tankDemon: strip(tank, 0, 0, 32, 36),
        chort: strip(atlas, 368, 273, 16, 23, 16),
        imp: strip(atlas, 368, 64, 16, 16, 16),
        wogol: strip(atlas, 368, 249, 16, 23, 16),
        bigDemon: strip(atlas, 16, 428, 32, 36),
      };

      let mode = 'idle';
      for (const id of ['idle', 'run']) {
        document.getElementById(id).addEventListener('click', () => {
          mode = id;
          document.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.id === id));
        });
      }

      function setup(id, w, h, scale) {
        const c = document.getElementById(id);
        c.width = w;
        c.height = h;
        c.style.width = `${w * scale}px`;
        c.style.height = `${h * scale}px`;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        return ctx;
      }
      // Pixels logiques : zoom = 2 sprites de 32 px ; jeu = largeur × 2 à l'affichage.
      const zoom = setup('zoom', 90, 46, 8);
      const game = setup('game', 260, 70, 4);

      function floor(ctx) {
        for (let y = 0; y < ctx.canvas.height; y += 16) {
          for (let x = 0; x < ctx.canvas.width; x += 16)
            ctx.drawImage(atlas, ...FLOOR, x, y, 16, 16);
        }
        ctx.fillStyle = `rgba(0, 0, 0, ${FLOOR_DARKEN})`;
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      }
      /** Dessine un sprite, pieds posés sur `feetY`, centré sur `cx`. */
      function draw(ctx, name, frame, cx, feetY, scale = 1) {
        const [img, x, y, w, h] = SPRITES[name][(mode === 'run' ? 4 : 0) + (frame % 4)];
        ctx.drawImage(
          img,
          x,
          y,
          w,
          h,
          Math.round(cx - (w * scale) / 2),
          feetY - h * scale,
          w * scale,
          h * scale,
        );
      }

      function render(t) {
        const frame = Math.floor(t / 1000 / FRAME_TIME);
        floor(zoom);
        draw(zoom, 'ogre', frame, 22, 42);
        draw(zoom, 'tankDemon', frame + 2, 66, 42);
        // Échelle du jeu : sprites ×2 (rapportés ici à ×0,5 du canevas affiché en ×4)
        floor(game);
        const feet = 62;
        draw(game, 'imp', frame, 22, feet);
        draw(game, 'chort', frame + 1, 50, feet);
        draw(game, 'wogol', frame + 3, 78, feet);
        draw(game, 'ogre', frame, 118, feet);
        draw(game, 'tankDemon', frame + 2, 162, feet);
        draw(game, 'bigDemon', frame + 1, 216, feet);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    </script>
  </body>
</html>
