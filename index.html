<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survivor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-root">
      <!-- La "scène" a exactement la taille du canvas : les overlays s'y accrochent, pas à la fenêtre -->
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="hud-xpbar"><div id="hud-xpfill"></div></div>
        <div id="hud-level">Niv 1</div>
        <div id="hud-hp">
          <div id="hud-hpfill"></div>
          <span id="hud-hptext">100 / 100</span>
        </div>
        <div id="hud-timer">00:00</div>
        <div id="hud-kills">0 kills</div>
        <div id="levelup-overlay" class="overlay overlay-levelup" hidden>
          <p id="levelup-title" class="overlay-title">NIVEAU 2</p>
          <div id="levelup-choices" class="choices"></div>
          <p class="overlay-hint">Clic ou touches 1 · 2 · 3</p>
        </div>
        <div id="pause-overlay" class="overlay" hidden>
          <p class="overlay-title">PAUSE</p>
          <p class="overlay-hint">Échap ou P pour reprendre</p>
        </div>
        <div id="end-overlay" class="overlay" hidden>
          <p id="end-title" class="overlay-title">MORT</p>
          <p id="end-info" class="overlay-info"></p>
          <div id="end-meter" class="meter"></div>
          <p class="overlay-hint">R pour rejouer</p>
        </div>
        <div id="debug-overlay" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
