<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survivor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-root">
      <!-- La "scène" a exactement la taille du canvas : les overlays s'y accrochent, pas à la fenêtre -->
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="hud-timer">00:00</div>
        <div id="pause-overlay" class="overlay" hidden>
          <p class="overlay-title">PAUSE</p>
          <p class="overlay-hint">Échap ou P pour reprendre</p>
        </div>
        <div id="death-overlay" class="overlay overlay-death" hidden>
          <p class="overlay-title">MORT</p>
          <p id="death-time" class="overlay-info"></p>
          <p class="overlay-hint">R pour rejouer</p>
        </div>
        <div id="debug-overlay" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
